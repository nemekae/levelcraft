<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="neeX — product engineer and software engineer portfolio, with Product Security, DevSecOps, Full-Stack, and AI/ML career roadmaps."
    />
    <link rel="stylesheet" href="styles.css" />
    <title>levelcraft</title>
  </head>
  <body>
    <div class="main">
      <div class="heading">
        <div class="header">
          <div class="header-logo">
            <img
              src="images/neex.png"
              alt="logo of neeX incorporation"
              id="the-logo"
            />
          </div>

          <ul class="header-know">
            <li><a href="#about">about</a></li>
            <li><a href="#portfolio">portfolio</a></li>
            <li><a href="#blog">blog</a></li>
            <li><a href="#contact">contact</a></li>
          </ul>

          <ul class="header-socials">
            <li>
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Twitter"
                ><img src="./images/twittter.png" class="logo-item" alt="Twitter"
              /></a>
            </li>
            <li>
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
                ><img src="./images/linkedin.png" class="logo-item" alt="LinkedIn"
              /></a>
            </li>
            <li>
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
                ><img src="./images/facebook.png" class="logo-item" alt="Facebook"
              /></a>
            </li>
            <li>
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
                ><img src="./images/insta.png" class="logo-item" alt="Instagram"
              /></a>
            </li>
          </ul>
        </div>
      </div>

      <div class="section-intro">
        <div class="section1 item" id="about">
          <div>
            <h2>designer</h2>
            <p>
              Product engineer specializing in designing <br> models and AI
              systems
            </p>
          </div>
          <div>
            <h2>&lt;coder&gt;</h2>
            <p>
              Software Engineer who writes clean, elegant <br> and efficient
              code.
            </p>
          </div>
        </div>
      </div>

      <div class="section-domains">
        <div class="section2 item" id="portfolio">
          <h3>TECH TRACKS &amp; PROJECTS</h3>
          <div class="domain">
            <div class="domains">
              <a
                href="routes/fullstack.html"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open the Full-Stack Engineering roadmap"
              >
                <img
                  src="images/swe.png"
                  alt="picture showing software engineering design"
                  class="domain-img"
                />
              </a>
            </div>
            <div class="domains">
              <a
                href="routes/devsecops.html"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open the DevSecOps roadmap"
              >
                <img
                  src="images/devsecop.png"
                  alt="picture showing devsecops design"
                  class="domain-img"
                />
              </a>
            </div>
            <div class="domains">
              <a
                href="routes/aiml.html"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open the AI/ML Engineering roadmap"
              >
                <img
                  src="images/ai.png"
                  alt="picture showing AI engineering design"
                  class="domain-img"
                />
              </a>
            </div>
            <div class="domains">
              <a
                href="routes/prodsec.html"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open the Product Security roadmap"
              >
                <img
                  src="images/prodsec.png"
                  alt="picture showing product security design"
                  class="domain-img"
                />
              </a>
            </div>
          </div>
        </div>
      </div>

      <div class="footing">
        <div class="footer item" id="contact">
          <div class="header-know">
            <p>©️ 2026 - Emeka Nwachukwu</p>
          </div>

          <ul class="header-socials">
            <li><a href="#portfolio">portfolio</a></li>
            <li><a href="#contact">contact</a></li>
            <li>
              <a
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
                ><img src="./images/github.png" class="logo-item" alt="GitHub"
              /></a>
            </li>
          </ul>
        </div>
